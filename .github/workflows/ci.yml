name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (all)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports:
          - 12111:12111
    env:
      AI_TRANSPORT: fixture
      STRIPE_MOCK: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - name: Write .env.local from the local stack
        run: |
          eval "$(npx supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=')"
          sed -e "s|^NEXT_PUBLIC_SUPABASE_ANON_KEY=.*|NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY|" \
              -e "s|^SUPABASE_SERVICE_ROLE_KEY=.*|SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY|" \
              -e "s|^CRON_SECRET=.*|CRON_SECRET=ci-cron-secret|" \
              -e "s|^APP_SECRET=.*|APP_SECRET=ci-app-secret-0123456789abcdef0123456789|" \
              -e "s|^AI_TRANSPORT=.*|AI_TRANSPORT=fixture|" \
              .env.example > .env.local

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Gate
        run: npm run gate -- all

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: docs/build/gates/
          retention-days: 30
